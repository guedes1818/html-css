<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0F1115" />
<meta name="description" content="FitTrack Pro — app premium de fitness e produtividade, totalmente editável. Todo número começa em zero e pertence a você. Funciona offline e guarda tudo no seu dispositivo." />
<meta name="color-scheme" content="dark light" />
<title>FitTrack Pro</title>
<style>
/* =====================================================================
   FitTrack Pro — design system
   Glassmorphism com tema escuro por padrão. Tema claro incluído.
   Nenhum recurso externo: fontes, ícones e gráficos são locais.
   ===================================================================== */

:root {
  color-scheme: dark;

  /* Superfícies */
  --bg: #0F1115;
  --bg-deep: #090A0E;
  --surface: #171A20;
  --surface-2: #1D212A;
  --glass: rgba(255, 255, 255, 0.055);
  --glass-2: rgba(255, 255, 255, 0.085);
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.14);

  /* Destaques (a cor é trocável pelo usuário em tempo real) */
  --accent: #C9FF4A;
  --accent-2: #5C6CFF;
  --on-accent: #0F1115;
  --on-accent-2: #FFFFFF;

  /* Tipografia */
  --text: #F3F5F9;
  --text-2: #A7AEBF;
  --muted: #767E90;

  /* Forma */
  --r: 24px;
  --r-lg: 30px;
  --r-sm: 16px;
  --r-xs: 12px;
  --blur: 20px;

  /* Profundidade */
  --shadow: 0 24px 50px -26px rgba(0, 0, 0, 0.9);
  --shadow-sm: 0 10px 24px -16px rgba(0, 0, 0, 0.8);
  --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 28%, transparent);

  /* Movimento */
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --fast: 160ms var(--ease);
  --slow: 420ms var(--ease);

  --font: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Inter, Roboto, system-ui, sans-serif;
}

[data-theme="light"] {
  color-scheme: light;
  --bg: #EEF0F5;
  --bg-deep: #E4E7EF;
  --surface: #FFFFFF;
  --surface-2: #F4F6FA;
  --glass: rgba(255, 255, 255, 0.72);
  --glass-2: rgba(255, 255, 255, 0.9);
  --line: rgba(16, 18, 26, 0.08);
  --line-strong: rgba(16, 18, 26, 0.16);
  --text: #12141A;
  --text-2: #4C5464;
  --muted: #737C8C;
  --shadow: 0 24px 50px -30px rgba(20, 24, 40, 0.45);
  --shadow-sm: 0 10px 24px -18px rgba(20, 24, 40, 0.5);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--bg-deep);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior-y: none;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  transition: background var(--slow), color var(--slow);
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

:focus-visible {
  outline: none;
  box-shadow: var(--ring);
  border-radius: var(--r-xs);
}

::-webkit-scrollbar { width: 0; height: 0; }

/* ---------- Fundo ambiente ---------- */
.ambient {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--accent) 9%, transparent) 0%, transparent 60%),
    var(--bg-deep);
}
.ambient span {
  position: absolute;
  display: block;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.5;
  animation: float 18s var(--ease) infinite alternate;
}
.ambient span:nth-child(1) {
  width: 46vmax; height: 46vmax; top: -18vmax; left: -12vmax;
  background: color-mix(in srgb, var(--accent) 34%, transparent);
}
.ambient span:nth-child(2) {
  width: 40vmax; height: 40vmax; bottom: -16vmax; right: -14vmax;
  background: color-mix(in srgb, var(--accent-2) 40%, transparent);
  animation-delay: -6s;
}
.ambient span:nth-child(3) {
  width: 30vmax; height: 30vmax; bottom: 22vmax; left: 42vmax;
  background: color-mix(in srgb, var(--accent) 16%, transparent);
  animation-delay: -11s;
}
@keyframes float {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to   { transform: translate3d(4vmax, 5vmax, 0) scale(1.12); }
}

/* ---------- Moldura do app ---------- */
.frame {
  position: relative;
  z-index: 1;
  width: min(452px, 100%);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
  overflow: hidden;
  isolation: isolate;
}

@media (min-width: 900px) and (min-height: 720px) {
  body { padding: 26px 0; }
  .frame {
    height: min(908px, calc(100dvh - 52px));
    border-radius: 44px;
    border: 1px solid var(--line-strong);
    box-shadow: 0 60px 120px -50px rgba(0, 0, 0, 0.95), 0 0 0 10px rgba(255, 255, 255, 0.02);
  }
}

.screen {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: max(18px, env(safe-area-inset-top)) 20px 132px;
  scroll-behavior: smooth;
}
.screen > * { animation: rise var(--slow) both; }
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}

/* ---------- Blocos compartilhados ---------- */
.glass {
  background: var(--glass);
  border: 1px solid var(--line);
  border-radius: var(--r);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(150%);
  backdrop-filter: blur(var(--blur)) saturate(150%);
  box-shadow: var(--shadow-sm);
}

.row { display: flex; align-items: center; gap: 12px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: grid; gap: 12px; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.eyebrow {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}
.section-title {
  margin: 26px 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.section-title h2 {
  margin: 0;
  font-size: 18px;
  letter-spacing: -0.02em;
  font-weight: 600;
}
.hint { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0; }

.icon-btn {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--glass);
  border: 1px solid var(--line);
  color: var(--text-2);
  transition: transform var(--fast), background var(--fast), color var(--fast);
  flex: none;
}
.icon-btn:hover { background: var(--glass-2); color: var(--text); transform: translateY(-1px); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 18px; height: 18px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 50px;
  padding: 0 20px;
  border-radius: 999px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
  background: var(--glass-2);
  border: 1px solid var(--line);
  color: var(--text);
  transition: transform var(--fast), filter var(--fast), background var(--fast);
}
.btn svg { width: 18px; height: 18px; }
.btn:hover { transform: translateY(-1px); }
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--accent);
  color: var(--on-accent);
  border-color: transparent;
  box-shadow: 0 14px 30px -16px color-mix(in srgb, var(--accent) 75%, transparent);
}
.btn-primary:hover { filter: brightness(1.06); }
.btn-danger { color: #FF6B7E; border-color: color-mix(in srgb, #FF6B7E 35%, transparent); }
.btn-block { width: 100%; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 22px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: -0.01em;
  background: var(--glass-2);
  color: var(--text-2);
}
.badge.up { background: color-mix(in srgb, #3DDC84 20%, transparent); color: #6BE5A4; }
.badge.down { background: color-mix(in srgb, #FF6B7E 20%, transparent); color: #FF93A2; }
.badge.down svg { transform: rotate(180deg); }
.badge svg { width: 11px; height: 11px; }

/* ---------- Saudação / barra superior ---------- */
.topbar { display: flex; align-items: center; gap: 12px; padding-top: 6px; }
.avatar {
  width: 46px; height: 46px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-weight: 700;
  font-size: 16px;
  color: var(--on-accent);
  background: linear-gradient(140deg, var(--accent), var(--accent-2));
  border: 1px solid var(--line-strong);
  overflow: hidden;
  flex: none;
  transition: transform var(--fast);
}
.avatar:active { transform: scale(0.94); }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.greeting small { display: block; color: var(--muted); font-size: 13px; }
.greeting strong { display: block; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }

.headline {
  margin: 20px 0 18px;
  font-size: clamp(28px, 8vw, 34px);
  line-height: 1.08;
  letter-spacing: -0.035em;
  font-weight: 700;
}
.headline em {
  font-style: normal;
  background: linear-gradient(100deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* ---------- Chips ---------- */
.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 20px 2px 0;
  margin: 0 -20px 16px 0;
  scrollbar-width: none;
}
.chip {
  flex: none;
  height: 40px;
  padding: 0 18px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--line);
  color: var(--text-2);
  font-size: 14px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: all var(--fast);
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: 0.85; }
.chip svg { width: 16px; height: 16px; flex: none; }
.chip:hover { border-color: var(--line-strong); color: var(--text); }
.chip[aria-pressed="true"] {
  background: var(--accent);
  color: var(--on-accent);
  border-color: transparent;
  font-weight: 600;
  box-shadow: 0 12px 26px -16px color-mix(in srgb, var(--accent) 80%, transparent);
}

/* ---------- Grade de atividades ---------- */
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }

.act-card {
  position: relative;
  min-height: 132px;
  padding: 14px;
  border-radius: var(--r);
  border: 1px solid var(--line);
  background: var(--glass);
  -webkit-backdrop-filter: blur(var(--blur));
  backdrop-filter: blur(var(--blur));
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: left;
  color: var(--text);
  overflow: hidden;
  touch-action: manipulation;
  transition: transform var(--fast), border-color var(--fast), box-shadow var(--fast);
}
.act-card::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(150deg, color-mix(in srgb, var(--c) 88%, transparent), color-mix(in srgb, var(--c) 34%, transparent));
  opacity: 0;
  transition: opacity var(--slow);
  z-index: -1;
}
.act-card.tinted { border-color: transparent; color: var(--c-on); }
.act-card.tinted::after { opacity: 1; }
.act-card.tinted .act-time { color: inherit; opacity: 0.85; }
.act-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.act-card:active { transform: scale(0.975); }
.act-card.done { opacity: 0.55; }
.act-card.done .act-title { text-decoration: line-through; }

.act-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.act-icon {
  width: 38px; height: 38px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.2);
}
.act-card:not(.tinted) .act-icon { background: var(--glass-2); border-color: var(--line); color: var(--c); }
.act-icon svg { width: 19px; height: 19px; }
.act-arrow { opacity: 0.75; }
.act-arrow svg { width: 16px; height: 16px; }
.act-title { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 2px; }
.act-time { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.act-meta { font-size: 11px; opacity: 0.8; margin-top: 3px; }

.add-tile {
  min-height: 132px;
  border-radius: var(--r);
  border: 1px dashed var(--line-strong);
  background: transparent;
  color: var(--text-2);
  display: grid;
  place-items: center;
  gap: 8px;
  align-content: center;
  font-size: 13px;
  font-weight: 500;
  transition: all var(--fast);
}
.add-tile span { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--glass-2); }
.add-tile svg { width: 18px; height: 18px; }
.add-tile:hover { color: var(--text); border-color: var(--accent); transform: translateY(-3px); }

/* Arrastar e soltar */
.act-card.dragging {
  z-index: 40;
  cursor: grabbing;
  transform: scale(1.05);
  box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.9);
  transition: none;
}
.drag-armed { transition: transform 220ms var(--ease); }

/* ---------- Estados vazios ---------- */
.empty {
  padding: 30px 22px;
  text-align: center;
  border-radius: var(--r);
  border: 1px dashed var(--line-strong);
  background: var(--glass);
  display: grid;
  gap: 10px;
  justify-items: center;
}
.empty .orb {
  width: 62px; height: 62px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--accent) 42%, transparent), transparent 70%),
              var(--glass-2);
  border: 1px solid var(--line);
  animation: pulse 3.4s var(--ease) infinite;
}
.empty .orb svg { width: 26px; height: 26px; color: var(--accent); }
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.07); opacity: 0.82; }
}
.empty h3 { margin: 0; font-size: 17px; letter-spacing: -0.02em; }
.empty p { margin: 0; max-width: 30ch; color: var(--muted); font-size: 13px; line-height: 1.55; }
.empty .btn { margin-top: 6px; }

/* ---------- Barra de navegação ---------- */
.tabbar {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom));
  width: calc(100% - 40px);
  max-width: 412px;
  height: 66px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  align-items: center;
  padding: 0 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 76%, transparent);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(26px) saturate(160%);
  backdrop-filter: blur(26px) saturate(160%);
  box-shadow: var(--shadow);
  z-index: 20;
}
.tab {
  height: 50px;
  display: grid;
  place-items: center;
  border-radius: 999px;
  color: var(--muted);
  position: relative;
  transition: color var(--fast);
}
.tab svg { width: 21px; height: 21px; position: relative; z-index: 1; }
.tab::before {
  content: "";
  position: absolute;
  inset: 4px 10px;
  border-radius: 999px;
  background: var(--accent);
  opacity: 0;
  transform: scale(0.6);
  transition: all 280ms var(--ease);
}
.tab[aria-current="page"] { color: var(--on-accent); }
.tab[aria-current="page"]::before { opacity: 1; transform: scale(1); }
.tab:not([aria-current="page"]):hover { color: var(--text); }

/* ---------- Calendário ---------- */
.cal-card {
  border-radius: var(--r-lg);
  padding: 20px 18px 22px;
  background: linear-gradient(158deg, var(--accent-2), color-mix(in srgb, var(--accent-2) 62%, #000));
  color: var(--on-accent-2);
  box-shadow: 0 26px 50px -28px color-mix(in srgb, var(--accent-2) 85%, transparent);
}
.cal-card .year { font-size: 13px; opacity: 0.75; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 18px; }
.cal-head h2 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
.cal-nav { display: flex; gap: 6px; }
.cal-nav button {
  width: 34px; height: 34px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(255, 255, 255, 0.16);
  color: inherit;
  transition: background var(--fast), transform var(--fast);
}
.cal-nav button:hover { background: rgba(255, 255, 255, 0.28); }
.cal-nav button:active { transform: scale(0.92); }
.cal-nav svg { width: 15px; height: 15px; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 2px; }
.cal-grid .wd {
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.06em;
  opacity: 0.7;
  padding-bottom: 6px;
}
.day {
  position: relative;
  aspect-ratio: 1;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 500;
  color: inherit;
  background: rgba(0, 0, 0, 0.26);
  transition: transform var(--fast), background var(--fast);
}
.day.out { opacity: 0.34; background: transparent; }
.day:hover { transform: scale(1.08); }
.day.today { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.75); }
.day.sel {
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
  transform: scale(1.06);
}
.day .marks {
  position: absolute;
  bottom: 6px;
  display: flex;
  gap: 2px;
}
.day .marks i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.9; }
.day.sel .marks i { background: var(--on-accent); }

/* ---------- Linha do tempo ---------- */
.timeline { display: grid; gap: 2px; }
.tl-item {
  display: grid;
  grid-template-columns: 22px 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 12px 0;
  position: relative;
  text-align: left;
  width: 100%;
  color: inherit;
}
.tl-item + .tl-item::before {
  content: "";
  position: absolute;
  left: 10px;
  top: -14px;
  height: 28px;
  width: 1.5px;
  background: var(--line);
}
.tl-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  display: grid; place-items: center;
  border: 2px solid var(--c);
  color: var(--c);
  background: var(--surface);
  transition: all var(--fast);
}
.tl-dot svg { width: 10px; height: 10px; opacity: 0; transition: opacity var(--fast); }
.tl-item.done .tl-dot { background: var(--c); color: var(--on-accent); }
.tl-item.done .tl-dot svg { opacity: 1; }
.tl-item.done .tl-title { text-decoration: line-through; color: var(--muted); }
.tl-title { font-size: 15px; font-weight: 600; letter-spacing: -0.015em; }
.tl-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tl-time { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }

/* ---------- Controle segmentado ---------- */
.seg {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  gap: 4px;
  padding: 4px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--line);
}
.seg button {
  height: 40px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  transition: all var(--fast);
}
.seg button[aria-pressed="true"] {
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 600;
}

.period-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 14px 0 16px;
  gap: 10px;
}
.period-nav strong { font-size: 14px; font-weight: 500; color: var(--text-2); }

/* ---------- Estatísticas ---------- */
.hero {
  border-radius: var(--r-lg);
  padding: 20px;
  background: linear-gradient(158deg, var(--accent-2), color-mix(in srgb, var(--accent-2) 55%, #05060A));
  color: var(--on-accent-2);
  box-shadow: 0 26px 50px -30px color-mix(in srgb, var(--accent-2) 85%, transparent);
}
.hero h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
.hero .sub { font-size: 12px; opacity: 0.72; margin-top: 2px; }
.hero-foot {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid rgba(255, 255, 255, 0.16);
}
.hero-foot div span { display: block; font-size: 11px; opacity: 0.72; margin-bottom: 3px; }

let S = blankState();

function load() {
  if (!storeKey) return;
  try {
    const raw = localStorage.getItem(storeKey);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === 'object') S = migrate(parsed);
  } catch (err) {
    console.warn('FitTrack Pro: não consegui ler os dados salvos, começando do zero.', err);
  }
}

/* Completa o que faltar num backup antigo/parcial para a interface nunca quebrar. */
function migrate(data) {
  const base = blankState();
  const out = Object.assign(base, data);
  out.schema = SCHEMA;
  out.profile = Object.assign(base.profile, data.profile || {});
  out.settings = Object.assign(base.settings, data.settings || {});
  out.categories = Array.isArray(data.categories) ? data.categories : base.categories;
  out.metrics = Array.isArray(data.metrics) && data.metrics.length ? data.metrics : base.metrics;
  out.activities = Array.isArray(data.activities) ? data.activities : [];
  out.logs = data.logs && typeof data.logs === 'object' ? data.logs : {};
  out.activities.forEach((a, i) => {
    if (typeof a.order !== 'number') a.order = i;
    if (!a.done || typeof a.done !== 'object') a.done = {};
  });
  return out;
}

let saveTimer = null;
let pendingKey = null;

/* A gravação é adiada alguns milissegundos para não escrever a cada tecla.
   A chave fica anotada junto: se a sessão trocar nesse meio tempo, os dados
   vão para o dono certo, nunca para o espaço de quem acabou de entrar. */
function save() {
  if (!storeKey) return;
  pendingKey = storeKey;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 90);
}

/* Grava agora o que estiver pendente. Chamado antes de trocar de sessão. */
function flushSave() {
  clearTimeout(saveTimer);
  saveTimer = null;
  if (!pendingKey) return;
  const key = pendingKey;
  pendingKey = null;
  try {
    localStorage.setItem(key, JSON.stringify(S));
  } catch (err) {
    toast('Armazenamento cheio ou bloqueado — as alterações podem não ser salvas.', 'close');
  }
}

/* Descarta a gravação pendente (usado ao excluir a conta). */
function cancelSave() {
  clearTimeout(saveTimer);
  saveTimer = null;
  pendingKey = null;
}

function esc(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* 8 796 em vez de 8.796 — combina com o respiro visual do resto da interface. */
function fmt(n, dec) {
  const d = dec || 0;
  const v = Number(n) || 0;
  const fixed = v.toFixed(d);
  const parts = fixed.split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return parts.join('.');
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function parseKey(key) {
  const [y, m, d] = key.split('-').map(Number);
  return new Date(y, m - 1, d);
}
const todayKey = () => dateKey(new Date());
function addDays(d, n) {
  const c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  c.setDate(c.getDate() + n);
  return c;
}
function startOfWeek(d) {
  const start = Number(S.settings.weekStart) || 0;
  const c = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = (c.getDay() - start + 7) % 7;
  return addDays(c, -diff);
}
const MONTHS = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
  'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
const MONTHS_SHORT = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun',
  'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const WEEKDAYS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const WEEKDAY_LONG = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira',
  'Quinta-feira', 'Sexta-feira', 'Sábado'];

function prettyDate(key) {
  const d = parseKey(key);
  const t = todayKey();
  if (key === t) return 'Hoje';
  if (key === dateKey(addDays(new Date(), 1))) return 'Amanhã';
  if (key === dateKey(addDays(new Date(), -1))) return 'Ontem';
  return WEEKDAYS[d.getDay()] + ', ' + d.getDate() + ' de ' + MONTHS_SHORT[d.getMonth()];
}
function prettyTime(hhmm) {
  if (!hhmm) return '';
  const [h, m] = hhmm.split(':').map(Number);
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
}

/* Cor de texto legível sobre qualquer cor escolhida pelo usuário. */
function onColor(hex) {
  const c = String(hex || '').replace('#', '');
  if (c.length < 6) return '#FFFFFF';
  const r = parseInt(c.slice(0, 2), 16) / 255;
  const g = parseInt(c.slice(2, 4), 16) / 255;
  const b = parseInt(c.slice(4, 6), 16) / 255;
  const lin = (v) => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  return L > 0.45 ? '#0F1115' : '#FFFFFF';
}

   --------------------------------------------------------------- */
function categoryById(id) {
  return S.categories.find((c) => c.id === id) || null;
}
function metricById(id) {
  return S.metrics.find((m) => m.id === id) || null;
}
function sortedActivities() {
  return S.activities.slice().sort((a, b) => (a.order - b.order) || a.time.localeCompare(b.time));
}

/* A atividade (possivelmente repetida) cai nesta data? */
function occursOn(act, key) {
  if (!act.date) return false;
  if (act.date === key) return true;
  if (key < act.date) return false;
  const rep = act.repeat || 'none';
  if (rep === 'none') return false;
  if (rep === 'daily') return true;
  const a = parseKey(act.date), b = parseKey(key);
  const days = Math.round((b - a) / 86400000);
  if (rep === 'weekly') return days % 7 === 0;
  if (rep === 'weekdays') return b.getDay() >= 1 && b.getDay() <= 5;
  if (rep === 'monthly') return a.getDate() === b.getDate();
  return false;
}
function activitiesOn(key) {
  return sortedActivities().filter((a) => occursOn(a, key));
}
const isDone = (act, key) => !!(act.done && act.done[key]);

/* Tempo de treino nunca é digitado duas vezes: é a soma do que foi concluído. */
function derivedDuration(key) {
  return activitiesOn(key).reduce((sum, a) => sum + (isDone(a, key) ? (Number(a.duration) || 0) : 0), 0);
}
function metricValue(id, key) {
  const m = metricById(id);
  if (m && m.kind === 'derived') return derivedDuration(key);
  const day = S.logs[key];
  return day && typeof day[id] === 'number' ? day[id] : 0;
}
function setMetricValue(id, key, value) {
  if (!S.logs[key]) S.logs[key] = {};
  const v = Number(value);
  if (!v) delete S.logs[key][id];
  else S.logs[key][id] = v;
  if (!Object.keys(S.logs[key]).length) delete S.logs[key];
  save();
}

/* Todos os dias de um intervalo, do mais antigo ao mais recente. */
function rangeKeys(from, to) {
  const keys = [];
  let cur = new Date(from.getFullYear(), from.getMonth(), from.getDate());
  const end = new Date(to.getFullYear(), to.getMonth(), to.getDate());
  while (cur <= end) { keys.push(dateKey(cur)); cur = addDays(cur, 1); }
  return keys;
}
function series(metricId, keys) {
  return keys.map((k) => metricValue(metricId, k));
}
function aggregate(metricId, keys) {
  const m = metricById(metricId);
  const vals = series(metricId, keys);
  const total = vals.reduce((a, b) => a + b, 0);
  if (!m || m.agg === 'sum') return total;
  const active = vals.filter((v) => v > 0);
  return active.length ? total / active.length : 0;
}
function dailyAverage(metricId, keys) {
  const vals = series(metricId, keys);
  const active = vals.filter((v) => v > 0);
  if (!active.length) return 0;
  const m = metricById(metricId);
  if (m && m.agg === 'avg') return active.reduce((a, b) => a + b, 0) / active.length;
  return vals.reduce((a, b) => a + b, 0) / keys.length;
}
function hasAnyData() {
  if (Object.keys(S.logs).length) return true;
  return S.activities.some((a) => Object.keys(a.done || {}).length);
}

const providerName = (p) => (p === 'google' ? 'Google' : p === 'apple' ? 'Apple' : 'e-mail e senha');

function loadAuth() {
  try {
    const raw = localStorage.getItem(AUTH_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && Array.isArray(parsed.users)) {
      AUTH.users = parsed.users;

      AUTH.legacyAdopted = !!parsed.legacyAdopted;
    }
  } catch (err) {

}
function saveAuth() {
  try { localStorage.setItem(AUTH_KEY, JSON.stringify(AUTH)); }
  catch (err) { toast('Não consegui salvar a conta neste navegador.', 'close'); }
}
function currentUser() { return AUTH.users.find((u) => u.id === AUTH.currentId) || null; }
function userByEmail(email) {
  const e = String(email || '').trim().toLowerCase();
  if (!e) return null;
  return AUTH.users.find((u) => String(u.email || '').toLowerCase() === e) || null;
}
const userStoreKey = (id) => LEGACY_KEY + '.' + id;

/* ---- senha ---- */
const canHash = !!(window.crypto && window.crypto.subtle && window.crypto.getRandomValues);
function bytesToHex(b) { return Array.from(b).map((x) => x.toString(16).padStart(2, '0')).join(''); }
function hexToBytes(h) {
  const out = new Uint8Array(h.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(h.substr(i * 2, 2), 16);
  return out;
}
function randomSalt() {
  const b = new Uint8Array(16);
  crypto.getRandomValues(b);
  return bytesToHex(b);
}
async function derivePassword(password, saltHex) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(password),
    'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: hexToBytes(saltHex), iterations: 150000, hash: 'SHA-256' }, key, 256);
  return bytesToHex(new Uint8Array(bits));
}

/* ---- sessão ---- */
function startSession(user) {
  flushSave();
  AUTH.currentId = user.id;
  user.lastSeen = new Date().toISOString();
  saveAuth();
  storeKey = userStoreKey(user.id);
  S = blankState();
  load();
  adoptLegacyData();
  if (!S.profile.name && user.name) S.profile.name = user.name;
  if (!S.profile.avatar && user.avatar) S.profile.avatar = user.avatar;
  save();
  applyTheme();
  view.tab = 'home';
  view.filter = 'all';
  authError = '';
  render();
}

/* Quem usou o app antes das contas não perde nada: os dados soltos
   passam para a primeira conta que entrar. */
function adoptLegacyData() {
  if (AUTH.legacyAdopted) return;
  let raw = null;
  try { raw = localStorage.getItem(LEGACY_KEY); } catch (err) { return; }
  AUTH.legacyAdopted = true;
  if (!raw) { saveAuth(); return; }
  try {
    const parsed = JSON.parse(raw);
    if (parsed && typeof parsed === 'object') {
      S = migrate(parsed);
      save();
      try { localStorage.removeItem(LEGACY_KEY); } catch (err) { /* segue */ }
      setTimeout(() => toast('Seus dados anteriores vieram para esta conta.', 'check'), 400);
    }
  } catch (err) { /* backup ilegível: começa limpo */ }
  saveAuth();
}

function signOut() {
  flushSave();
  AUTH.currentId = null;
  saveAuth();
  storeKey = null;
  S = blankState();
  view.authMode = 'signin';
  authError = '';
  applyTheme();
  render();
}

async function signUp(name, email, password) {
  const nome = String(name || '').trim();
  const mail = String(email || '').trim();
  if (!nome) throw new Error('Digite seu nome.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)) throw new Error('Digite um e-mail válido.');
  if (userByEmail(mail)) throw new Error('Já existe uma conta com esse e-mail neste dispositivo.');
  if (canHash && String(password).length < 6) throw new Error('A senha precisa de pelo menos 6 caracteres.');
  const user = {
    id: uid(), provider: 'local', name: nome, email: mail, avatar: '',
    createdAt: new Date().toISOString(),
  };
  if (canHash) {
    user.salt = randomSalt();
    user.hash = await derivePassword(password, user.salt);
  }
  AUTH.users.push(user);
  saveAuth();
  startSession(user);
  toast('Conta criada. Bem-vindo!', 'spark');
}

async function signIn(email, password) {
  const user = userByEmail(email);
  if (!user) throw new Error('Não encontrei nenhuma conta com esse e-mail neste dispositivo.');
  if (user.provider !== 'local') throw new Error('Essa conta entra com ' + providerName(user.provider) + '.');
  if (user.hash) {
    const hash = await derivePassword(String(password), user.salt);
    if (hash !== user.hash) throw new Error('Senha incorreta.');
  }
  startSession(user);
}

/* ---- entrada social ---- */
function decodeJwt(token) {
  const part = String(token).split('.')[1];
  const json = decodeURIComponent(atob(part.replace(/-/g, '+').replace(/_/g, '/'))
    .split('').map((c) => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
  return JSON.parse(json);
}

function upsertSsoUser(provider, claims) {
  const sub = claims.sub || claims.email;
  if (!sub) { authFail('O provedor não devolveu uma identificação.'); return; }
  let user = AUTH.users.find((u) => u.provider === provider && u.sub === sub);
  if (!user) {
    user = {
      id: uid(), provider: provider, sub: sub,
      name: claims.name || String(claims.email || '').split('@')[0] || 'Sem nome',
      email: claims.email || '', avatar: claims.picture || '',
      createdAt: new Date().toISOString(),
    };
    AUTH.users.push(user);
  } else {
    if (claims.name) user.name = claims.name;
    if (claims.email) user.email = claims.email;
    if (claims.picture) user.avatar = claims.picture;
  }
  saveAuth();
  startSession(user);
}

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector('script[data-sso="' + src + '"]')) return resolve();
    const el = document.createElement('script');
    el.src = src;
    el.async = true;
    el.dataset.sso = src;
    el.onload = () => resolve();
    el.onerror = () => reject(new Error('script bloqueado'));
    document.head.appendChild(el);
  });
}

async function googleSignIn() {
  try {
    await loadScript('https://accounts.google.com/gsi/client');
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: SSO.google.clientId,
      scope: 'openid email profile',
      callback: async (resp) => {
        try {
          const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo',
            { headers: { Authorization: 'Bearer ' + resp.access_token } });
          const info = await r.json();
          upsertSsoUser('google', info);
        } catch (err) {
          authFail('Entrei no Google, mas não consegui buscar seu perfil.');
        }
      },
    });
    client.requestAccessToken();
  } catch (err) {
    authFail('Não consegui carregar o Google daqui. Isso só funciona com o app publicado em https.');
  }
}

async function appleSignIn() {
  try {
    await loadScript('https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/pt_BR/appleid.auth.js');
    window.AppleID.auth.init({
      clientId: SSO.apple.clientId,
      scope: 'name email',
      redirectURI: SSO.apple.redirectURI || location.href,
      usePopup: true,
    });
    const res = await window.AppleID.auth.signIn();
    const claims = decodeJwt(res.authorization.id_token);
    if (res.user && res.user.name) {
      claims.name = [res.user.name.firstName, res.user.name.lastName].filter(Boolean).join(' ');
    }
    upsertSsoUser('apple', claims);
  } catch (err) {
    authFail('Não consegui concluir a entrada com a Apple.');
  }
}

   --------------------------------------------------------------- */
function statPeriod() {
  const anchor = parseKey(view.statAnchor);
  if (view.statRange === 'daily') {
    return { keys: [view.statAnchor], label: prettyDate(view.statAnchor), step: 1 };
  }
  if (view.statRange === 'weekly') {
    const from = startOfWeek(anchor);
    const to = addDays(from, 6);
    const label = from.getDate() + ' ' + MONTHS_SHORT[from.getMonth()] + ' – ' +
      to.getDate() + ' ' + MONTHS_SHORT[to.getMonth()] + ', ' + to.getFullYear();
    return { keys: rangeKeys(from, to), label: label, step: 7 };
  }
  const from = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const to = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0);
  return { keys: rangeKeys(from, to), label: MONTHS[from.getMonth()] + ' ' + from.getFullYear(), step: 'month' };
}
function previousKeys(period) {
  const first = parseKey(period.keys[0]);
  if (period.step === 'month') {
    const from = new Date(first.getFullYear(), first.getMonth() - 1, 1);
    const to = new Date(first.getFullYear(), first.getMonth(), 0);
    return rangeKeys(from, to);
  }
  const span = period.keys.length;
  const to = addDays(first, -1);
  return rangeKeys(addDays(to, -(span - 1)), to);
}
function shiftAnchor(dir) {
  const anchor = parseKey(view.statAnchor);
  if (view.statRange === 'daily') view.statAnchor = dateKey(addDays(anchor, dir));
  else if (view.statRange === 'weekly') view.statAnchor = dateKey(addDays(anchor, dir * 7));
  else view.statAnchor = dateKey(new Date(anchor.getFullYear(), anchor.getMonth() + dir, 1));
}

/* Gráfico de barras arredondadas, desenhado com os números do usuário. */
function barChart(values, labels, color, height) {
  const h = height || 92;
  const n = values.length || 1;
  const max = Math.max.apply(null, values.concat([0]));
  const gap = n > 14 ? 2 : 6;
  const w = 100;
  const bw = (w - gap * (n - 1)) / n;
  const plot = h - (labels ? 14 : 0);
  let bars = '';
  for (let i = 0; i < n; i++) {
    const ratio = max > 0 ? values[i] / max : 0;
    const bh = Math.max(ratio * (plot - 6), values[i] > 0 ? 4 : 2.5);
    const x = i * (bw + gap);
    const y = plot - bh;
    bars += '<rect class="bar" x="' + x.toFixed(2) + '" y="' + y.toFixed(2) + '" width="' + bw.toFixed(2) +
      '" height="' + bh.toFixed(2) + '" rx="' + Math.min(bw / 2, 3).toFixed(2) + '" ' +
      'fill="' + (values[i] > 0 ? color : 'currentColor') + '" ' +
      'opacity="' + (values[i] > 0 ? 1 : 0.22) + '" style="animation-delay:' + (i * 26) + 'ms"></rect>';
  }
  let axis = '';
  if (labels) {
    const every = n > 14 ? Math.ceil(n / 7) : 1;
    axis = labels.map((l, i) => (i % every === 0
      ? '<text class="axis" x="' + (i * (bw + gap) + bw / 2).toFixed(2) + '" y="' + h +
        '" text-anchor="middle">' + esc(l) + '</text>'
      : '')).join('');
  }
  return '<svg class="chart" viewBox="0 0 100 ' + h + '" preserveAspectRatio="none" role="img" ' +
    'aria-label="Gráfico">' + bars + '<g style="font:inherit">' + axis + '</g></svg>';
}

function sparkline(values, color) {
  const n = values.length;
  if (n < 2) return '';
  const max = Math.max.apply(null, values.concat([0])) || 1;
  const pts = values.map((v, i) => (i / (n - 1) * 100).toFixed(2) + ',' + (24 - (v / max) * 22).toFixed(2));
  return '<svg class="spark" viewBox="0 0 100 26" preserveAspectRatio="none" aria-hidden="true">' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color +
    '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/></svg>';
}

function trendBadge(now, before) {
  if (!before && !now) return '';
  if (!before) return '<span class="badge up">' + icon('up') + 'novo</span>';
  const pct = Math.round((now - before) / before * 100);
  if (pct === 0) return '<span class="badge">0%</span>';
  const up = pct > 0;
  return '<span class="badge ' + (up ? 'up' : 'down') + '">' + icon('up') +
    (up ? '+' : '') + pct + '%</span>';
}

function viewStats() {
  const period = statPeriod();
  const prev = previousKeys(period);
  const focus = metricById(S.focusMetric) || S.metrics[0];

  let html = '<header class="topbar" style="margin-bottom:16px">' +
    '<div class="grow"><small class="eyebrow">Análises</small>' +
    '<h1 style="margin:4px 0 0;font-size:24px;letter-spacing:-0.03em">Estatísticas</h1></div>' +
    '<button class="icon-btn" data-act="log-day" data-key="' + todayKey() + '" aria-label="Registrar métricas">' +
    icon('plus') + '</button></header>';

  html += '<div class="seg">' + [['daily', 'Diário'], ['weekly', 'Semanal'], ['monthly', 'Mensal']].map((r) =>
    '<button data-act="range" data-id="' + r[0] + '" aria-pressed="' + (view.statRange === r[0]) + '">' +
    r[1] + '</button>').join('') + '</div>';

  html += '<div class="period-nav">' +
    '<button class="icon-btn" data-act="shift" data-dir="-1" aria-label="Período anterior">' + icon('left') + '</button>' +
    '<strong>' + esc(period.label) + '</strong>' +
    '<button class="icon-btn" data-act="shift" data-dir="1" aria-label="Próximo período">' + icon('right') + '</button>' +
    '</div>';

  if (!hasAnyData()) {
    html += emptyState('stats', 'Ainda sem números — de propósito',
      'O FitTrack Pro nunca inventa dados. Registre uma métrica ou conclua uma atividade agendada: estes gráficos se constroem a partir dos seus dias reais.',
      'Registrar métricas de hoje', 'log-day', todayKey());
    html += '<div class="section-title"><h2>Defina suas metas</h2></div>';
    html += '<div class="list">' + S.metrics.map((m) => goalRow(m)).join('') + '</div>';
    return html;
  }

  /* Destaque: a métrica em foco ao longo do período. */
  const single = period.keys.length === 1;
  /* No modo diário o gráfico mostra os 7 dias até a data, como contexto. */
  const chartKeys = single
    ? rangeKeys(addDays(parseKey(period.keys[0]), -6), parseKey(period.keys[0]))
    : period.keys;
  const values = series(focus.id, chartKeys);
  const dayValues = series(focus.id, period.keys);
  const total = aggregate(focus.id, period.keys);
  const labels = chartKeys.map((k) => {
    const d = parseKey(k);
    return period.step === 'month' ? String(d.getDate()) : WEEKDAYS[d.getDay()].charAt(0);
  });
  const best = Math.max.apply(null, dayValues.concat([0]));
  const activeDays = dayValues.filter((v) => v > 0).length;
  const goalPct = focus.goal > 0 ? clamp(Math.round(total / focus.goal * 100), 0, 999) + '%' : '—';

  html += '<section class="hero">' +
    '<div class="row between"><div><h3>' + esc(focus.label) + '</h3>' +
    '<div class="sub">' + (single ? 'Últimos 7 dias'
      : (focus.agg === 'avg' ? 'Média' : 'Total') + ' no período') + '</div></div>' +
    '<button class="icon-btn" data-act="pick-focus" aria-label="Trocar métrica em destaque" ' +
    'style="background:rgba(255,255,255,.18);border-color:transparent;color:inherit">' + icon('dropdown') + '</button>' +
    '</div>' +
    barChart(values, labels, '#FFFFFF', 92) +
    '<div class="hero-foot">' +
    '<div><span>' + (focus.agg === 'avg' ? 'Média' : 'Total') + '</span><b>' + fmt(total, focus.dec) + '</b></div>' +
    (single
      ? '<div><span>Meta</span><b>' + (focus.goal > 0 ? fmt(focus.goal, focus.dec) : '—') + '</b></div>' +
        '<div><span>Da meta</span><b>' + goalPct + '</b></div>'
      : '<div><span>Melhor dia</span><b>' + fmt(best, focus.dec) + '</b></div>' +
        '<div><span>Dias ativos</span><b>' + activeDays + '/' + period.keys.length + '</b></div>') +
    '</div></section>';

  html += '<div class="section-title"><h2>Métricas</h2>' +
    '<button class="icon-btn" data-act="new-metric" aria-label="Adicionar métrica">' + icon('plus') + '</button></div>';

  html += '<div class="grid-2">' + S.metrics.map((m) => {
    const avg = dailyAverage(m.id, period.keys);
    const before = dailyAverage(m.id, prev);
    const pct = m.goal > 0 ? clamp(Math.round(avg / m.goal * 100), 0, 100) : 0;
    return '<button class="metric-card" data-act="metric-menu" data-id="' + m.id + '" style="--c:' + esc(m.color) + '">' +
      '<div class="row between"><div class="grow"><div class="metric-label truncate">' + esc(m.label) + '</div>' +
      '<div class="metric-sub">' + (single ? 'No dia' : 'Média diária') + '</div></div>' +
      trendBadge(avg, before) + '</div>' +
      '<div class="metric-value">' + fmt(avg, m.dec) + '<small>' + esc(m.unit) + '</small></div>' +
      '<div class="progress"><i data-w="' + pct + '"></i></div>' +
      '<div class="metric-goal">' + (m.goal > 0 ? 'Meta ' + fmt(m.goal, m.dec) + ' ' + esc(m.unit) : 'Toque para definir uma meta') + '</div>' +
      sparkline(series(m.id, period.keys), m.color) +
      '</button>';
  }).join('') + '</div>';

  return html;
}

function goalRow(m) {
  return '<button class="list-item" data-act="edit-goal" data-id="' + m.id + '">' +
    '<span class="li-icon" style="color:' + esc(m.color) + '">' + icon(m.icon || 'target') + '</span>' +
    '<span class="grow"><span class="li-title">' + esc(m.label) + '</span>' +

}

let sheetEl = null;
function closeSheet() {
  if (!sheetEl) return;
  const el = sheetEl;
  sheetEl = null;
  el.style.animation = 'fade 180ms var(--ease) reverse both';
  setTimeout(() => el.remove(), 170);
}
function openSheet(title, body, footer) {
  closeSheet();
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = '<section class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
    '<div class="sheet-head"><span class="grabber"></span>' +
    '<h2 class="grow">' + esc(title) + '</h2>' +
    '<button class="icon-btn" data-act="close-sheet" aria-label="Fechar">' + icon('close') + '</button></div>' +
    '<div class="sheet-body">' + body + '</div>' +
    (footer ? '<div class="sheet-foot">' + footer + '</div>' : '') +
    '</section>';
  scrim.addEventListener('pointerdown', (e) => { if (e.target === scrim) closeSheet(); });
  $('#frame').appendChild(scrim);
  sheetEl = scrim;
  const focusable = scrim.querySelector('input, select, textarea, button.btn-primary');
  if (focusable && !('ontouchstart' in window)) setTimeout(() => focusable.focus(), 60);
  return scrim;
}
function sheetVal(id) {
  const el = sheetEl && sheetEl.querySelector('#' + id);
  return el ? el.value : '';
}

function confirmSheet(title, text, danger) {
  return new Promise((resolve) => {
    openSheet(title,
      '<p class="hint" style="font-size:14px;margin-bottom:8px">' + text + '</p>',
      '<button class="btn" data-act="confirm-no">Cancelar</button>' +
      '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" data-act="confirm-yes">' +
      (danger || 'Confirmar') + '</button>');
    sheetEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      if (b.dataset.act === 'confirm-yes') { closeSheet(); resolve(true); }
      if (b.dataset.act === 'confirm-no' || b.dataset.act === 'close-sheet') { closeSheet(); resolve(false); }
    });
  });
}

function optionsSheet(title, options, current, onPick) {
  openSheet(title, '<div class="list">' + options.map((o) =>
    '<button class="list-item" data-pick="' + esc(o.value) + '">' +
    '<span class="grow"><span class="li-title">' + esc(o.label) + '</span>' +
    (o.sub ? '<span class="li-sub">' + esc(o.sub) + '</span>' : '') + '</span>' +
    (String(o.value) === String(current) ? '<span class="li-chev" style="color:var(--accent)">' + icon('check') + '</span>' : '') +
    '</button>').join('') + '</div>');
  sheetEl.addEventListener('click', (e) => {
    const b = e.target.closest('[data-pick]');
    if (!b) return;
    closeSheet();
    onPick(b.dataset.pick);
  });
}

    '<input class="input" id="f-duration" type="number" min="0" step="1" inputmode="numeric" value="' +
    (a.duration || '') + '" placeholder="0" /></div>' +

    '<select class="select" id="f-repeat">' +
    [['none', 'Não repete'], ['daily', 'Todo dia'], ['weekdays', 'Dias úteis'],
     ['weekly', 'Toda semana'], ['monthly', 'Todo mês']].map((r) =>
      '<option value="' + r[0] + '"' + (a.repeat === r[0] ? ' selected' : '') + '>' + r[1] + '</option>').join('') +
    '</select></div></div>' +

    '<div class="field"><label for="f-notes">Notas</label>' +

    esc(a.notes) + '</textarea></div>' +

    switchRow('Cartão preenchido', 'Mostrar a atividade como bloco colorido', 'f-tinted', a.tinted) +
    '</div>' +

    (isNew ? '' :
      '<div class="row" style="gap:8px">' +
      '<button class="btn grow" data-act="duplicate-activity" data-id="' + a.id + '">' + icon('copy') + 'Duplicar</button>' +

  el.addEventListener('click', (e) => {

      draft.icon = ib.dataset.icon;
      $$('#f-icons [data-icon]', el).forEach((b) => b.setAttribute('aria-pressed', String(b === ib)));

    }
    const cb = e.target.closest('[data-color]');
    if (cb) {
      draft.color = cb.dataset.color;
      $$('#f-colors [data-color]', el).forEach((b) => b.setAttribute('aria-pressed', String(b === cb)));

    }

      if (on && sw.dataset.act === 'f-reminder') requestNotifications();
    }
  });
  const custom = $('#f-color-custom', el);
  if (custom) custom.addEventListener('input', () => {
    draft.color = custom.value;

  draft.duration = Math.max(0, Number(sheetVal('f-duration')) || 0);
  draft.repeat = sheetVal('f-repeat') || 'none';
  draft.notes = sheetVal('f-notes').trim();

async function savePassword() {
  const u = currentUser();
  if (!u) return;
  const nova = sheetVal('pw-new');
  const rep = sheetVal('pw-rep');
  if (nova.length < 6) { toast('A senha precisa de pelo menos 6 caracteres.', 'close'); return; }
  if (nova !== rep) { toast('As duas senhas não são iguais.', 'close'); return; }
  if (u.hash) {
    const atual = await derivePassword(sheetVal('pw-old'), u.salt);
    if (atual !== u.hash) { toast('Senha atual incorreta.', 'close'); return; }
  }
  u.salt = randomSalt();
  u.hash = await derivePassword(nova, u.salt);
  saveAuth();
  closeSheet();
  render();
  toast('Senha atualizada.', 'check');
}

function moveActivity(id, dir) {
  const list = sortedActivities();
  const i = list.findIndex((a) => a.id === id);
  const j = i + Number(dir);
  if (i < 0 || j < 0 || j >= list.length) return;
  const tmp = list[i];
  list[i] = list[j];
  list[j] = tmp;
  list.forEach((a, k) => { a.order = k; });
  save();
  render();
  manageActivitiesSheet();
}

/* ---------------------------------------------------------------
   14. Reordenar arrastando (ponteiro — funciona no toque e no mouse)
   --------------------------------------------------------------- */
let drag = null;

function onPointerDown(e) {
  if (e.button != null && e.button !== 0) return;
  const card = e.target.closest('[data-drag]');
  if (!card || sheetEl) return;
  const grid = card.parentElement;
  const startX = e.clientX, startY = e.clientY;

  const timer = setTimeout(() => {
    const items = Array.from(grid.querySelectorAll('[data-drag]'));
    const rects = items.map((el) => el.getBoundingClientRect());
    drag = { card, grid, items, rects, startX, startY, moved: false, index: items.indexOf(card) };
    card.classList.add('dragging');
    card.style.pointerEvents = 'none';
    haptic(12);
  }, 260);

  /* Rolar a tela cancela o gesto; soltar o dedo remove todos os ouvintes. */
  const guard = (ev) => {
    if (drag) return;
    if (Math.abs(ev.clientX - startX) > 8 || Math.abs(ev.clientY - startY) > 8) clearTimeout(timer);
  };
  const cancel = () => {
    clearTimeout(timer);
    window.removeEventListener('pointermove', guard);
    window.removeEventListener('pointerup', cancel);
    window.removeEventListener('pointercancel', cancel);
  };
  window.addEventListener('pointermove', guard);
  window.addEventListener('pointerup', cancel);
  window.addEventListener('pointercancel', cancel);
}

function onPointerMove(e) {
  if (!drag) return;
  e.preventDefault();
  const dx = e.clientX - drag.startX;
  const dy = e.clientY - drag.startY;
  if (Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
  drag.card.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(1.05)';

  let target = -1;
  for (let i = 0; i < drag.rects.length; i++) {
    const r = drag.rects[i];
    if (e.clientX > r.left && e.clientX < r.right && e.clientY > r.top && e.clientY < r.bottom) { target = i; break; }
  }
  if (target > -1 && target !== drag.index) {
    const ref = drag.items[target];
    if (target > drag.index) ref.after(drag.card); else ref.before(drag.card);
    drag.items = Array.from(drag.grid.querySelectorAll('[data-drag]'));
    drag.index = drag.items.indexOf(drag.card);
    drag.rects = drag.items.map((el) => el.getBoundingClientRect());
    haptic(6);
  }
}

function onPointerUp() {
  if (!drag) return;
  const { card, grid } = drag;
  card.classList.remove('dragging');
  card.style.transform = '';
  card.style.pointerEvents = '';
  const ids = Array.from(grid.querySelectorAll('[data-drag]')).map((el) => el.dataset.id);
  const rest = sortedActivities().filter((a) => ids.indexOf(a.id) === -1);
  const ordered = ids.map((id) => S.activities.find((a) => a.id === id)).filter(Boolean).concat(rest);
  ordered.forEach((a, i) => { a.order = i; });
  save();
  const moved = drag.moved;
  drag = null;
  if (moved) { toast('Ordem atualizada.', 'grip'); setTimeout(render, 60); }
}

/* ---------------------------------------------------------------
   15. Backup, restauração e limpeza
   --------------------------------------------------------------- */
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fittrack-pro-' + todayKey() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Backup exportado.', 'download');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json,.json';
  input.addEventListener('change', () => {
    const f = input.files && input.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        if (!parsed || typeof parsed !== 'object') throw new Error('formato inválido');
        const ok = await confirmSheet('Restaurar backup?',
          'Os dados atuais serão substituídos pelo conteúdo do arquivo.', 'Restaurar');
        if (!ok) return;
        S = migrate(parsed);
        save();
        applyTheme();
        render();
        toast('Backup restaurado.', 'upload');
      } catch (err) {
        toast('Não consegui ler esse arquivo.', 'close');
      }
    };
    reader.readAsText(f);
  });
  input.click();
}

async function resetStats() {
  const ok = await confirmSheet('Zerar estatísticas?',
    'Todos os valores registrados e marcações de conclusão voltam a zero. Atividades, metas e ajustes continuam.', 'Zerar');
  if (!ok) return;
  S.logs = {};
  S.activities.forEach((a) => { a.done = {}; });
  save();
  render();
  toast('Estatísticas zeradas.', 'reset');
}

async function resetAll() {
  const ok = await confirmSheet('Apagar tudo?',
    'Atividades, metas, métricas, registros e perfil serão removidos deste dispositivo. Não dá para desfazer.', 'Apagar tudo');
  if (!ok) return;
  S = blankState();
  save();
  applyTheme();
  view.filter = 'all';
  render();
  toast('Tudo limpo. Começando do zero.', 'spark');
}

/* ---------------------------------------------------------------
   16. Lembretes
   --------------------------------------------------------------- */
const firedReminders = new Set();

function requestNotifications() {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'default') {
    Notification.requestPermission().catch(() => {});
  }
}

function checkReminders() {
  if (!S.settings.notifications) return;
  const now = new Date();
  const key = dateKey(now);
  const lead = Number(S.settings.reminderLead) || 0;
  activitiesOn(key).forEach((a) => {
    if (!a.reminder || !a.time || isDone(a, key)) return;
    const [h, m] = a.time.split(':').map(Number);
    const at = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m);
    const diff = (at - now) / 60000;
    const tag = a.id + '@' + key;
    if (diff <= lead && diff > lead - 1.2 && !firedReminders.has(tag)) {
      firedReminders.add(tag);
      const msg = a.title + ' começa ' + (lead > 0 ? 'em ' + lead + ' min' : 'agora');
      if ('Notification' in window && Notification.permission === 'granted') {
        try { new Notification('FitTrack Pro', { body: msg }); } catch (e) { /* ignore */ }
      }
      toast(msg, 'bell');
    }
  });
}

/* ---------------------------------------------------------------
   17. Eventos
   --------------------------------------------------------------- */
const ACTIONS = {
  tab(el) { view.tab = el.dataset.id; render(); },
  filter(el) { view.filter = el.dataset.id; render(); },
  today() {
    view.selected = todayKey();
    const n = new Date();
    view.calMonth = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0');
    render();
  },
  month(el) {
    const [y, m] = view.calMonth.split('-').map(Number);
    const d = new Date(y, m - 1 + Number(el.dataset.dir), 1);
    view.calMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    render();
  },
  'pick-day'(el) {
    view.selected = el.dataset.key;
    const d = parseKey(view.selected);
    view.calMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    render();
  },
  range(el) { view.statRange = el.dataset.id; render(); },
  shift(el) { shiftAnchor(Number(el.dataset.dir)); render(); },
  'pick-focus'() {
    optionsSheet('Métrica em destaque', S.metrics.map((m) => ({ value: m.id, label: m.label, sub: m.unit })),
      S.focusMetric, (v) => { S.focusMetric = v; save(); render(); });
  },

  'new-activity'(el) { activitySheet(null, el.dataset.key || (view.tab === 'calendar' ? view.selected : todayKey())); },
  'edit-activity'(el) { activitySheet(S.activities.find((a) => a.id === el.dataset.id)); },
  'open-activity'(el) { activityDetailSheet(el.dataset.id, el.dataset.key); },
  'save-activity'() { saveActivityFromSheet(); },
  'duplicate-activity'(el) { duplicateActivity(el.dataset.id); },
  'delete-activity'(el) { deleteActivity(el.dataset.id); },
  'manage-activities'() { manageActivitiesSheet(); },
  move(el) { moveActivity(el.dataset.id, el.dataset.dir); },
  'toggle-done'(el) {
    const a = S.activities.find((x) => x.id === el.dataset.id);
    if (!a) return;
    const key = el.dataset.key;
    if (!a.done) a.done = {};
    if (a.done[key]) delete a.done[key]; else a.done[key] = true;
    save();
    haptic();
    closeSheet();
    render();
    if (a.done[key]) toast('Concluída: ' + a.title);
  },

  'log-day'(el) { logDaySheet(el.dataset.key || todayKey()); },
  'save-log'(el) { saveLog(el.dataset.key); },
  'log-metric'(el) { logDaySheet(el.dataset.key || todayKey()); },
  'metric-menu'(el) { metricSheet(el.dataset.id); },
  'edit-goal'(el) { metricSheet(el.dataset.id); },
  'new-metric'() { metricSheet(null); },
  'save-metric'() { saveMetric(); },
  'delete-metric'(el) { deleteMetric(el.dataset.id); },

  'manage-categories'() { categoriesSheet(); },
  'new-category'() { categorySheet(null); },
  'edit-category'(el) { categorySheet(el.dataset.id); },
  'save-category'() { saveCategory(); },
  'delete-category'(el) { deleteCategory(el.dataset.id); },

  profile() { profileSheet(); },
  'save-profile'() { saveProfile(); },
  'clear-avatar'() { S.profile.avatar = ''; save(); closeSheet(); render(); profileSheet(); },

  theme(el) { S.settings.theme = el.dataset.id; save(); applyTheme(); render(); },
  accent(el) { S.settings.accent = el.dataset.id; save(); applyTheme(); render(); },
  accent2(el) { S.settings.accent2 = el.dataset.id; save(); applyTheme(); render(); },
  'week-start'() {
    optionsSheet('Semana começa em', WEEKDAYS.map((d, i) => ({ value: i, label: WEEKDAY_LONG[i] })),
      S.settings.weekStart, (v) => { S.settings.weekStart = Number(v); save(); render(); });
  },
  'toggle-notifications'() {
    S.settings.notifications = !S.settings.notifications;
    if (S.settings.notifications) requestNotifications();
    save();
    render();
  },
  'reminder-lead'() {
    optionsSheet('Avisar com antecedência', [0, 5, 10, 15, 30, 60].map((n) =>
      ({ value: n, label: n === 0 ? 'Na hora exata' : n + ' minutos antes' })),
      S.settings.reminderLead, (v) => { S.settings.reminderLead = Number(v); save(); render(); });
  },
  reminders() {
    const key = todayKey();
    const pending = activitiesOn(key).filter((a) => !isDone(a, key));
    if (!pending.length) { toast('Nada pendente por hoje.', 'check'); return; }
    toast(pending.length + (pending.length === 1 ? ' atividade pendente hoje.' : ' atividades pendentes hoje.'), 'bell');
  },

  'auth-mode'() {
    view.authMode = view.authMode === 'signup' ? 'signin' : 'signup';
    authError = '';
    render();
  },
  'auth-submit'() { submitAuth(); },
  'auth-pick'(el) {
    const u = AUTH.users.find((x) => x.id === el.dataset.id);
    if (!u) return;
    view.authEmail = u.email || '';
    authError = '';
    if (u.provider !== 'local') { ACTIONS.sso({ dataset: { id: u.provider } }); return; }
    render();
    const field = $('#au-pass') || $('#au-email');
    if (field) field.focus();
  },
  sso(el) {
    const id = el.dataset.id;
    const cfg = SSO[id];
    if (!cfg || !cfg.clientId) { ssoSetupSheet(id); return; }
    if (id === 'google') googleSignIn(); else appleSignIn();
  },
  account() { accountSheet(); },
  'save-account'() { saveAccount(); },
  'change-password'() { passwordSheet(); },
  'save-password'() { savePassword(); },
  'sign-out'() { closeSheet(); signOut(); },
  'delete-account'() { deleteAccount(); },

  export() { exportData(); },
  import() { importData(); },
  'reset-stats'() { resetStats(); },
  'reset-all'() { resetAll(); },
  'close-sheet'() { closeSheet(); },
};

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (drag) return;
  e.preventDefault();
  fn(el);
});

document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.dataset.act === 'accent-custom') { S.settings.accent = el.value; save(); applyTheme(); }
  if (el.dataset.act === 'accent2-custom') { S.settings.accent2 = el.value; save(); applyTheme(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && sheetEl) { closeSheet(); return; }
  if (e.key === 'Enter' || e.key === ' ') {
    const card = e.target.closest('[data-act="open-activity"]');
    if (card && card.getAttribute('role') === 'button') { e.preventDefault(); card.click(); }
  }
});

window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });

document.addEventListener('pointerdown', onPointerDown);
document.addEventListener('pointermove', onPointerMove, { passive: false });
document.addEventListener('pointerup', onPointerUp);
document.addEventListener('pointercancel', onPointerUp);

/* Mantém o dia em sincronia se o app ficar aberto depois da meia-noite. */
let lastDay = todayKey();
setInterval(() => {
  checkReminders();
  if (todayKey() !== lastDay) { lastDay = todayKey(); render(); }
}, 30000);

/* Outra aba alterou os dados — recarrega. */
window.addEventListener('storage', (e) => {
  if (e.key === AUTH_KEY) { loadAuth(); render(); return; }
  if (!storeKey || e.key !== storeKey) return;
  load();
  applyTheme();
  render();
});

/* ---------------------------------------------------------------
   18. Inicialização
   --------------------------------------------------------------- */
loadAuth();
const booted = currentUser();
if (booted) {
  storeKey = userStoreKey(booted.id);
  load();
  adoptLegacyData();
}
applyTheme();
render();
</script>
